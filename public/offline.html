<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13241F">
<meta name="robots" content="noindex">
<title>You're offline</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; background: #13241F; color: #E9EFEC; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; }
  main { max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { margin: 6px 0 0; font-size: 26px; line-height: 1.15; color: #fff; }
  p { margin: 0; color: #B9CBC3; }
  button { margin-top: 10px; height: 50px; padding: 0 28px; border: 0; border-radius: 14px; background: #3FB58A; color: #0B1F18; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/brand/icon-192.png" alt="" width="88" height="88">
  <h1>You're offline</h1>
  <p>Safara needs an internet connection to book your flight. Your chat is safe and will be here when you're back online.</p>
  <button type="button" id="retry">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', () => location.reload());
  window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
